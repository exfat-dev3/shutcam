<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ペット自動撮影カメラ (Googleドライブ保存)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f7f9fa;
            color: #333;
            padding: 20px;
        }
        h1 { font-size: 1.5rem; color: #4a5568; }
        #status {
            font-weight: bold;
            color: #e53e3e;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }
        .camera-box {
            position: relative;
            display: inline-block;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        video {
            display: block;
            width: 100%;
            max-width: 500px;
            height: auto;
        }
        .photo-container {
            margin-top: 20px;
        }
        canvas { display: none; }
        img {
            max-width: 100%;
            width: 500px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 4px solid #fff;
        }
    </style>
</head>
<body>

    <h1>🐾 ペット自動撮影カメラ 🐾</h1>
    <p id="status">カメラの権限を許可してください...</p>

    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="photo-container">
        <canvas id="canvas"></canvas>
        <div id="result-label"></div>
        <img id="photo" alt="" />
    </div>

    <script>
        // 【重要】ここにステップ1-9でコピーした「ウェブアプリのURL」を貼り付けてください
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx2eNns_YtW-vNgUHHpyu1DNb9BTtI6KjZM6T8_thCnXN8t12hxL3TX-tlYmArxKfFH/exec";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const statusText = document.getElementById('status');
        const resultLabel = document.getElementById('result-label');

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                statusText.innerText = "📸 許可されました！1秒後に撮影してGoogleドライブに送ります...";
                statusText.style.color = "#3182ce";

                setTimeout(() => {
                    takePhotoAndUpload();
                }, 1000);

            } catch (err) {
                console.error(err);
                statusText.innerText = "❌ カメラのアクセスに失敗しました。";
            }
        });

        async function takePhotoAndUpload() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataDataURL = canvas.toDataURL('image/png');
            photo.src = dataDataURL;

            statusText.innerText = "⏳ データをGoogleドライブにアップロード中...";
            statusText.style.color = "#d69e2e";

            try {
                // Google Apps Scriptへ非同期で写真データを送信
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ image: dataDataURL })
                });

                const result = await response.json();

                if (result.status === "success") {
                    statusText.innerText = "☁️ Googleドライブへの自動保存が完了しました！";
                    statusText.style.color = "#38a169";
                    resultLabel.innerHTML = "<h3>パシャリ！📸 保存された写真：</h3>";
                } else {
                    throw new Error(result.message);
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "❌ Googleドライブへの保存に失敗しました。設定を確認してください。";
                statusText.style.color = "#e53e3e";
            }
        }
    </script>
</body>
</html>
